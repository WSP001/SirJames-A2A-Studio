<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sir James Adventures - Chapter 3: The Dragon's Riddle</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .chapter-subtitle {
            text-align: center;
            font-size: 1.3em;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .home-link {
            display: block;
            text-align: center;
            margin-bottom: 30px;
        }
        .home-link a {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #333;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2em;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(255,215,0,0.4);
            transition: all 0.3s ease;
        }
        .home-link a:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255,215,0,0.6);
        }
        .scenes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .scene-card {
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 20px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }
        .scene-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.25);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .scene-number {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        .scene-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }
        .scene-thumb {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .start-btn {
            display: block;
            text-align: center;
            margin-top: 30px;
        }
        .start-btn a {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 20px 60px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.4em;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(76,175,80,0.4);
            transition: all 0.3s ease;
        }
        .start-btn a:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(76,175,80,0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chapter 3</h1>
        <div class="chapter-subtitle">The Dragon's Riddle</div>
        
        <div class="home-link">
            <a href="../index.html">🏠 All Chapters</a>
        </div>
        
        <div class="scenes-grid">
            
        <a href="scene-001/index.html" class="scene-card">
            <div class="scene-number">Scene 1</div>
            <div class="scene-title">Meeting the Dragon</div>
            <img src="images/scene-001.png" alt="Meeting the Dragon" class="scene-thumb">
        </a>

        <a href="scene-002/index.html" class="scene-card">
            <div class="scene-number">Scene 2</div>
            <div class="scene-title">The First Riddle</div>
            <img src="images/scene-002.png" alt="The First Riddle" class="scene-thumb">
        </a>

        <a href="scene-003/index.html" class="scene-card">
            <div class="scene-number">Scene 3</div>
            <div class="scene-title">Thinking Together</div>
            <img src="images/scene-003.png" alt="Thinking Together" class="scene-thumb">
        </a>

        <a href="scene-004/index.html" class="scene-card">
            <div class="scene-number">Scene 4</div>
            <div class="scene-title">The Answer</div>
            <img src="images/scene-004.png" alt="The Answer" class="scene-thumb">
        </a>

        <a href="scene-005/index.html" class="scene-card">
            <div class="scene-number">Scene 5</div>
            <div class="scene-title">The Dragon's Gift</div>
            <img src="images/scene-005.png" alt="The Dragon's Gift" class="scene-thumb">
        </a>

        <a href="scene-006/index.html" class="scene-card">
            <div class="scene-number">Scene 6</div>
            <div class="scene-title">A Promise Made</div>
            <img src="images/scene-006.png" alt="A Promise Made" class="scene-thumb">
        </a>

        <a href="scene-007/index.html" class="scene-card">
            <div class="scene-number">Scene 7</div>
            <div class="scene-title">The Journey Down</div>
            <img src="images/scene-007.png" alt="The Journey Down" class="scene-thumb">
        </a>

        <a href="scene-008/index.html" class="scene-card">
            <div class="scene-number">Scene 8</div>
            <div class="scene-title">Gramps's Pride</div>
            <img src="images/scene-008.png" alt="Gramps's Pride" class="scene-thumb">
        </a>
        </div>
        
        <div class="start-btn">
            <a href="scene-001/index.html">▶️ Start Chapter</a>
        </div>
    </div>
</body>
</html>
