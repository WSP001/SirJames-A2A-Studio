<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Model Toggle - Sir James Adventures</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .toggle-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #4a5568;
            margin-bottom: 30px;
        }
        
        .toggle-group {
            margin-bottom: 20px;
        }
        
        .toggle-label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #2d3748;
        }
        
        .toggle-switch {
            position: relative;
            width: 100%;
            height: 60px;
            background: #e2e8f0;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .toggle-switch.active {
            background: #48bb78;
        }
        
        .toggle-option {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .toggle-option.left {
            left: 20px;
            color: #718096;
        }
        
        .toggle-option.right {
            right: 20px;
            color: #718096;
        }
        
        .toggle-switch.active .toggle-option.left {
            color: white;
        }
        
        .toggle-switch:not(.active) .toggle-option.right {
            color: white;
        }
        
        .toggle-slider {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .toggle-switch.active .toggle-slider {
            left: calc(100% - 55px);
        }
        
        .test-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e2e8f0;
        }
        
        .test-button {
            width: 100%;
            padding: 15px;
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .test-button:hover {
            background: #3182ce;
        }
        
        .test-button:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f7fafc;
            border-radius: 10px;
            border-left: 4px solid #4299e1;
        }
        
        .cost-display {
            margin-top: 10px;
            font-size: 14px;
            color: #718096;
        }
        
        .model-status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        
        .status-dalle {
            background: #fed7d7;
            color: #c53030;
        }
        
        .status-gemini {
            background: #c6f6d5;
            color: #276749;
        }
    </style>
</head>
<body>
    <div class="toggle-container">
        <h1>
            🎨 Image Model Toggle
            <span id="modelStatus" class="model-status status-dalle">DALL-E</span>
        </h1>
        
        <div class="toggle-group">
            <label class="toggle-label">Choose Image Generator:</label>
            <div class="toggle-switch" id="modelToggle">
                <span class="toggle-option left">DALL-E 3</span>
                <span class="toggle-option right">Gemini</span>
                <div class="toggle-slider"></div>
            </div>
        </div>
        
        <div class="test-section">
            <button class="test-button" id="testButton">
                🧪 Test with Sir James Character
            </button>
            
            <div id="result" class="result" style="display: none;">
                <div id="resultContent"></div>
                <div id="costDisplay" class="cost-display"></div>
            </div>
        </div>
    </div>
    
    <script>
        let currentModel = 'dalle';
        const toggle = document.getElementById('modelToggle');
        const testButton = document.getElementById('testButton');
        const result = document.getElementById('result');
        const resultContent = document.getElementById('resultContent');
        const costDisplay = document.getElementById('costDisplay');
        const modelStatus = document.getElementById('modelStatus');
        
        // Toggle switch
        toggle.addEventListener('click', () => {
            currentModel = currentModel === 'dalle' ? 'gemini' : 'dalle';
            toggle.classList.toggle('active');
            
            // Update status badge
            if (currentModel === 'gemini') {
                modelStatus.textContent = 'Gemini';
                modelStatus.className = 'model-status status-gemini';
            } else {
                modelStatus.textContent = 'DALL-E';
                modelStatus.className = 'model-status status-dalle';
            }
        });
        
        // Test button
        testButton.addEventListener('click', async () => {
            testButton.disabled = true;
            testButton.textContent = '⏳ Generating...';
            
            const testPrompt = 'Sir James, a 5-year-old boy with bright blue eyes and sandy brown hair, wearing a royal blue tunic with silver Celtic trim, standing in a medieval castle courtyard with his Redbone Coonhound dog Claude';
            
            try {
                const response = await fetch('/.netlify/functions/image-generator-switch', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: testPrompt,
                        model: currentModel,
                        style: 'cartoon',
                        size: '1792x1024'
                    })
                });
                
                const data = await response.json();
                
                if (data.imageUrl) {
                    resultContent.innerHTML = `
                        <strong>✅ Generated with ${data.model}</strong><br>
                        <strong>Prompt:</strong> ${data.prompt}<br>
                        ${data.imageUrl.startsWith('data:') ? 
                            `<em>Image Description:</em> ${atob(data.imageUrl.split(',')[1])}` : 
                            `<img src="${data.imageUrl}" style="max-width: 100%; border-radius: 10px; margin-top: 10px;">`
                        }
                    `;
                    
                    costDisplay.textContent = `💰 Cost: $${data.cost.toFixed(4)} USD`;
                    result.style.display = 'block';
                } else {
                    throw new Error(data.error || 'No image generated');
                }
                
            } catch (error) {
                resultContent.innerHTML = `<strong>❌ Error:</strong> ${error.message}`;
                costDisplay.textContent = '';
                result.style.display = 'block';
            }
            
            testButton.disabled = false;
            testButton.textContent = '🧪 Test with Sir James Character';
        });
    </script>
</body>
</html>
