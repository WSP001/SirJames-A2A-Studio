<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sir James Adventures - Chapter 1 - Castle Gates</title>
    
    <script src="/js/storyflow.js" defer></script><style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .scene-container {
            flex: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .scene-title {
            font-size: 1.8em;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .scene-image {
            width: 100%;
            max-height: 50vh;
            object-fit: contain;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .narration-box {
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }
        .narration-text {
            font-size: 1.4em;
            line-height: 1.6;
            text-align: center;
        }
        .character-name {
            font-weight: bold;
            color: #ffd700;
            display: block;
            margin-bottom: 10px;
        }
        .audio-controls {
            text-align: center;
            margin: 15px 0;
        }
        .play-btn {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            color: #333;
            padding: 15px 40px;
            min-height: 48px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,215,0,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255,215,0,0.6);
        }
        .play-btn:active {
            transform: scale(0.98);
        }
        .navigation {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: auto;
            padding: 20px 0;
        }
        .nav-button {
            flex: 1;
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            text-decoration: none;
            text-align: center;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .nav-button:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        .nav-button.primary {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border-color: #4CAF50;
        }
        @media (max-width: 600px) {
            .scene-title { font-size: 1.4em; }
            .narration-text { font-size: 1.2em; }
            .play-btn { padding: 12px 30px; font-size: 1em; }
        }
    </style>
</head>
<body>
    <div class="scene-container">
        <h1 class="scene-title">Castle Gates</h1>
        
        <img src="../images/scene-004.png" 
             alt="Large wooden castle gates opening wide with morning sunlight streaming through, Sir James and Claude stepping through into a new adventure, epic persp"
             class="scene-image">
        
        <div class="narration-box">
            <div class="narration-text">
                <span class="character-name">Narrator:</span>
                The great castle gates creaked open, revealing the world beyond.
            </div>
        </div>
        
        <div class="audio-controls">
            <button class="play-btn" id="playBtn" aria-label="Play narration">
                ▶ Tap to Listen
            </button>
            <audio id="narration" preload="auto">
                <source src="../audio/004-01.mp3" type="audio/mpeg">
            </audio>
        </div>
        
                <!-- Big Home Button for easy navigation back to all chapters -->
        <a href="../../index.html" class="home-button">🏠 All Chapters</a>
        
        <div class="navigation">
            <a href="../scene-003/index.html" class="nav-button">⬅️ Back</a>
            <a href="../scene-005/index.html" class="nav-button primary">Next ➡️</a>
        </div>
    </div>
    
    <script>
        const audio = document.getElementById('narration');
        const playBtn = document.getElementById('playBtn');
        let isPlaying = false;
        
        playBtn.addEventListener('click', function() {
            if (isPlaying) {
                audio.pause();
                playBtn.textContent = '▶ Tap to Listen';
                isPlaying = false;
            } else {
                audio.play().then(() => {
                    playBtn.textContent = '⏸ Pause';
                    isPlaying = true;
                }).catch(e => {
                    console.log('Audio play failed:', e);
                    playBtn.textContent = '▶ Tap Again';
                });
            }
        });
        
        audio.addEventListener('ended', function() {
            playBtn.textContent = '▶ Play Again';
            isPlaying = false;
        });
        
        document.addEventListener('touchstart', function() {
            audio.load();
        }, { once: true });
    </script>
</body>
</html>
