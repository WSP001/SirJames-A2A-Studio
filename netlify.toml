[build]
  # Book002 is pre-built static content - no build step needed
  command = "echo 'Book002 static deploy - no build required'"
  publish = "public-book002"
  # Temporarily disable functions to allow static deploy
  ignore_functions = true

[build.environment]
  NODE_VERSION = "18"

[dev]
  command = "npx http-server public-book002 -p 5173"
  targetPort = 5173
  port = 8888
  autoLaunch = false
